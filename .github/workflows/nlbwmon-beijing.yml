name: nlbwmon Beijing midnight (25.12.2 x86-64)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nlbwmon-beijing.yml'
      - 'tools/nlbwmon-beijing/**'
permissions:
  contents: read
concurrency:
  group: nlbwmon-beijing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd patch cpio
      - name: Test Beijing midnight and historical compatibility
        run: |
          mkdir -p build-logs
          bash tools/nlbwmon-beijing/test.sh 2>&1 | tee build-logs/timing-tests.log
      - name: Build APK with pinned ImmortalWrt SDK
        run: bash tools/nlbwmon-beijing/build.sh
      - name: Upload package and validation results
        uses: actions/upload-artifact@v4
        with:
          name: nlbwmon-beijing-25.12.2-x86_64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlbwmon-build-logs-${{ github.run_number }}
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14
